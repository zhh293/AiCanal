name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix: {java: [11, 21]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "${{ matrix.java }}", cache: maven}
      - run: mvn -B -ntp verify
